# CI + deploy for markdownwizard.app — family deploy model (wizard-web
# .github/workflows/deploy.yml): the e2e suite always runs; the deploy job
# gates on credentials + the Pages project and SKIPS GREEN when either is
# absent, so this workflow needs no secrets to be green and can't conflict
# with dashboard Git integration. When a CLOUDFLARE_API_TOKEN secret exists
# (Account · Cloudflare Pages · Edit) and the `markdownwizard` Pages project
# is bootstrapped, pushes to main direct-upload the site.

name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install test deps + browser
        working-directory: tests
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: End-to-end suite (drives the app, validates every export format)
        working-directory: tests
        run: node e2e.mjs

  deploy:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - id: gate
        name: Check credentials + Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '8a0d49b1f3fdcdadec135562ec8a4fdc' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping deploy (the live site keeps its last upload)."
            exit 0
          fi
          if curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/markdownwizard" \
               | grep -q '"success": *true'; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages project 'markdownwizard' not visible to this token — skipping deploy."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.ok == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc

      - name: Stage the site (app files only)
        if: steps.gate.outputs.ok == 'true'
        run: |
          mkdir -p /tmp/site
          cp -a . /tmp/site/
          rm -rf /tmp/site/.git /tmp/site/.github /tmp/site/tests \
                 /tmp/site/README.md /tmp/site/LICENSE /tmp/site/.gitignore /tmp/site/.nvmrc
          # /tmp/site deliberately has no .git; wrangler runs from the checkout below
          # so the deployment records the real commit and commit-dirty=false —
          # cf-pages-workers-audit (§4) flags any deploy that matches no commit.

      - name: Deploy to Cloudflare Pages (production)
        if: steps.gate.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '8a0d49b1f3fdcdadec135562ec8a4fdc' }}
        run: npx wrangler@4 pages deploy /tmp/site --project-name markdownwizard --branch main --commit-dirty=false
